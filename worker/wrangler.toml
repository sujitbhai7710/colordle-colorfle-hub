name = "color-answers-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ac1e8cfe748b673d1997aa434ad2494e"

# Cron triggers in UTC:
# 1:30 AM JST (Japan) = 16:30 UTC (previous day) → "30 16 * * *" — PRIMARY update
# 8:00 AM IST = 02:30 UTC → "30 2 * * *" — backup update
# 11:00 AM IST = 05:30 UTC → "30 5 * * *" — backup update
[triggers]
crons = ["30 16 * * *", "30 2 * * *", "30 5 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "color-answers-db"
database_id = "47a84a49-879d-4ffc-a768-09c5f34a188c"
